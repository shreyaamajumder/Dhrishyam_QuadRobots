services:
  db:
    image: pgvector/pgvector:pg16
    container_name: dhrishyam-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: brandguard
      POSTGRES_PASSWORD: brandguard
      POSTGRES_DB: brandguard
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brandguard"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: dhrishyam-backend
    restart: unless-stopped
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    environment:
      ENV: local
      DEMO_MODE: "true"
      DATABASE_URL: postgresql://brandguard:brandguard@db:5432/brandguard
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_JWT_AUDIENCE: authenticated
      LLM_ENABLED: "true"
      LLM_PROVIDER: gemini
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - ./backend:/srv
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: dhrishyam-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  pgdata:
