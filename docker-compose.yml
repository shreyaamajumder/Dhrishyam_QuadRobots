services:
  db:
    image: pgvector/pgvector:pg16
    container_name: dhrishyam-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: brandguard
      POSTGRES_PASSWORD: brandguard
      POSTGRES_DB: brandguard
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U brandguard" ]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: dhrishyam-backend
    restart: unless-stopped
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    environment:
      ENV: local
      DEMO_MODE: "true"
      DATABASE_URL: postgresql://brandguard:brandguard@db:5432/brandguard
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_JWT_AUDIENCE: authenticated
      LLM_ENABLED: ${LLM_ENABLED:-true}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - ./backend:/srv
      - ./tests:/srv/tests
      - ./pytest.ini:/srv/pytest.ini
      - ./.env:/srv/.env
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: dhrishyam-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      BACKEND_PROXY_URL: http://backend:8000
      VITE_API_URL: ${VITE_API_URL:-}
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - ./tests:/tests
      - ./frontend:/frontend
    depends_on:
      - backend

volumes:
  pgdata:
